spring.application.name=airbnb
spring.datasource.url=jdbc:postgresql://localhost:5434/airbnb
spring.datasource.username=airbnb
spring.datasource.password=airbnb_local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=airbnb
app.jwt.expiration-seconds=900

app.booking.expiration-delay-ms=30000
app.stripe.secret-key=${STRIPE_SECRET_KEY}

app.stripe.success-url=http://localhost:8080/payments/success?session_id={CHECKOUT_SESSION_ID}
app.stripe.cancel-url=http://localhost:8080/payments/cancel

app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

app.stripe.webhook-worker-enabled=true
app.stripe.webhook-worker-delay-ms=5000

app.stripe.refund-worker-enabled=true
app.stripe.refund-worker-delay-ms=5000

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true

spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=10000
spring.kafka.producer.properties[delivery.timeout.ms]=30000

app.kafka.booking-topic=booking.events.v1

app.outbox.publisher-enabled=true
app.outbox.publisher-delay-ms=1000


spring.kafka.consumer.group-id=booking-confirmation-report-v1

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=10

spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3

app.kafka.booking-consumer-enabled=true

logging.level.com.rohith.javaprojects.airbnb.scheduler=DEBUG
logging.level.com.rohith.javaprojects.airbnb.aspect=DEBUG

management.server.port=8081
management.server.address=0.0.0.0

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never

management.metrics.tags.application=airbnb

management.metrics.distribution.percentiles-histogram.http.server.requests=true

app.monitoring.password=${MONITORING_PASSWORD}

# Capture every trace while learning locally
management.tracing.sampling.probability=1.0

# Spring Boot 4 Zipkin exporter configuration
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

management.tracing.export.zipkin.connect-timeout=2s
management.tracing.export.zipkin.read-timeout=5s

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.rate-limit.redis.host=${RATE_LIMIT_REDIS_HOST:localhost}
app.rate-limit.redis.port=${RATE_LIMIT_REDIS_PORT:6380}

spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=1s

app.rate-limit.hotel-search.limit=5
app.rate-limit.hotel-search.window-ms=60000

spring.mvc.async.request-timeout=30s

app.overview.max-concurrent=4

