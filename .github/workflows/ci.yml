name: Airbnb CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Java application and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: sh ./mvnw -B -DskipTests package

      - name: Build Docker image
        run: docker build --tag airbnb-app:ci .

      - name: Verify Java inside the image
        run: docker run --rm --entrypoint java airbnb-app:ci -version