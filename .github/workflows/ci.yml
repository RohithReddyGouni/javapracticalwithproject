name: Airbnb CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Java application and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: sh ./mvnw -B -DskipTests package

      - name: Build Docker image
        run: docker build --tag airbnb-app:ci .

      - name: Verify Java inside the image
        run: docker run --rm --entrypoint java airbnb-app:ci -version

  publish:
    name: Publish Docker image
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/rohithreddygouni/javapracticalwithproject
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Download project code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Build and publish both platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify Java on AMD64
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint java \
            "$IMAGE_NAME:$IMAGE_TAG" \
            -version

      - name: Verify Java on ARM64
        run: |
          docker run --rm \
            --platform linux/arm64 \
            --entrypoint java \
            "$IMAGE_NAME:$IMAGE_TAG" \
            -version