services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: airbnb
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: airbnb_local
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb -d airbnb"]
      interval: 5s
      timeout: 5s
      retries: 10
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.13.5
    ports:
      - "127.0.0.1:9090:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    secrets:
      - prometheus_monitoring_password
  grafana:
    image: grafana/grafana:13.2.4

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

    secrets:
      - grafana_admin_password

    depends_on:
      - prometheus
  zipkin:
    image: openzipkin/zipkin:3.6.1
    ports:
      - "127.0.0.1:9411:9411"
  redis:
    image: redis:8.2.10-alpine
    ports:
      - "127.0.0.1:6379:6379"

    command:
      - redis-server
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
  redis-ratelimit:
    image: redis:8.2.10-alpine
    ports:
      - "127.0.0.1:6380:6379"

    command:
      - redis-server
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "64mb"
      - "--maxmemory-policy"
      - "noeviction"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: airbnb-app:local

    env_file:
      - ./.secrets/app.env

    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8080"

      MANAGEMENT_SERVER_ADDRESS: "0.0.0.0"
      MANAGEMENT_SERVER_PORT: "8081"

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/airbnb
      SPRING_DATASOURCE_USERNAME: airbnb

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      RATE_LIMIT_REDIS_HOST: redis-ratelimit
      RATE_LIMIT_REDIS_PORT: "6379"

      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-ratelimit:
        condition: service_healthy
      zipkin:
        condition: service_started

    stop_grace_period: 60s
volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:

secrets:
  prometheus_monitoring_password:
    file: ./.secrets/prometheus-password

  grafana_admin_password:
    file: ./.secrets/grafana-admin-password