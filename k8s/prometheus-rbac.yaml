apiVersion: v1
kind: ServiceAccount

metadata:
  name: prometheus
  namespace: airbnb

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: prometheus-pod-reader
  namespace: airbnb

rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: prometheus-pod-reader
  namespace: airbnb

subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: airbnb

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-reader