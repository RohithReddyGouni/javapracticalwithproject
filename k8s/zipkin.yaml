apiVersion: v1
kind: Service

metadata:
  name: zipkin
  namespace: airbnb

spec:
  selector:
    app: zipkin

  ports:
    - name: http
      port: 9411
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: zipkin
  namespace: airbnb

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zipkin

  template:
    metadata:
      labels:
        app: zipkin

    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false

      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.6.1

          ports:
            - name: http
              containerPort: 9411

          env:
            - name: STORAGE_TYPE
              value: mem

            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3