apiVersion: v1
kind: ConfigMap

metadata:
  name: kafka-config
  namespace: airbnb

data:
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"

  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"

  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-0.kafka-headless.airbnb.svc.cluster.local:9092"

  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-0.kafka-headless.airbnb.svc.cluster.local:9093"

  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data/logs"

  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

---
apiVersion: v1
kind: Service

metadata:
  name: kafka-headless
  namespace: airbnb

spec:
  clusterIP: None
  publishNotReadyAddresses: true

  selector:
    app: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker

    - name: controller
      port: 9093
      targetPort: controller

---
apiVersion: v1
kind: Service

metadata:
  name: kafka
  namespace: airbnb

spec:
  selector:
    app: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker

---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: kafka
  namespace: airbnb

spec:
  serviceName: kafka-headless
  replicas: 1

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60

      securityContext:
        fsGroup: 1000

      containers:
        - name: kafka
          image: apache/kafka:4.1.1

          envFrom:
            - configMapRef:
                name: kafka-config

          ports:
            - name: broker
              containerPort: 9092

            - name: controller
              containerPort: 9093

          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

          startupProbe:
            tcpSocket:
              port: broker
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  KAFKA_HEAP_OPTS='-Xms32m -Xmx128m'
                  /opt/kafka/bin/kafka-topics.sh
                  --bootstrap-server 127.0.0.1:9092
                  --list >/dev/null
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3

  volumeClaimTemplates:
    - metadata:
        name: kafka-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi