apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: prometheus-data
  namespace: airbnb

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: Service

metadata:
  name: prometheus
  namespace: airbnb

spec:
  selector:
    app: prometheus

  ports:
    - name: http
      port: 9090
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: airbnb

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      enableServiceLinks: false
      serviceAccountName: prometheus
      automountServiceAccountToken: true

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534

      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.5

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=1GB

          ports:
            - name: http
              containerPort: 9090

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

          volumeMounts:
            - name: configuration
              mountPath: /etc/prometheus
              readOnly: true

            - name: monitoring-password
              mountPath: /etc/prometheus/secrets
              readOnly: true

            - name: data
              mountPath: /prometheus

          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: configuration
          configMap:
            name: prometheus-config

        - name: monitoring-password
          secret:
            secretName: airbnb-app-secrets
            defaultMode: 0440
            items:
              - key: MONITORING_PASSWORD
                path: monitoring-password

        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data