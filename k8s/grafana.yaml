apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: grafana-data
  namespace: airbnb

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service

metadata:
  name: grafana
  namespace: airbnb

spec:
  selector:
    app: grafana

  ports:
    - name: http
      port: 3000
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: airbnb

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472

      containers:
        - name: grafana
          image: grafana/grafana:13.2.4

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin

            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /etc/grafana/secrets/admin-password

            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana

            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            - name: credentials
              mountPath: /etc/grafana/secrets
              readOnly: true

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data

        - name: datasources
          configMap:
            name: grafana-datasources

        - name: credentials
          secret:
            secretName: grafana-credentials
            defaultMode: 0440