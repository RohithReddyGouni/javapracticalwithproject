apiVersion: v1
kind: Service

metadata:
  name: airbnb
  namespace: airbnb

spec:
  selector:
    app: airbnb

  ports:
    - name: http
      port: 8080
      targetPort: http

    - name: management
      port: 8081
      targetPort: management

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: airbnb
  namespace: airbnb

spec:
  replicas: 2
  minReadySeconds: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: airbnb

  template:
    metadata:
      labels:
        app: airbnb

    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      containers:
        - name: airbnb
          image: ghcr.io/rohithreddygouni/javapracticalwithproject:sha-457cc7d652edcaa9634fa60c2fe796f61a3843e9
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

            - name: management
              containerPort: 8081

          envFrom:
            - configMapRef:
                name: airbnb-app-config

            - secretRef:
                name: airbnb-app-secrets

          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3