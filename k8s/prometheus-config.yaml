apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: airbnb

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: airbnb
        metrics_path: /actuator/prometheus

        basic_auth:
          username: prometheus
          password_file: /etc/prometheus/secrets/monitoring-password

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - airbnb

        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: airbnb

          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: management

          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace