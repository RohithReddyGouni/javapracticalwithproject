apiVersion: v1
kind: ConfigMap

metadata:
  name: airbnb-app-config
  namespace: airbnb

data:
  SERVER_ADDRESS: "0.0.0.0"
  SERVER_PORT: "8080"

  MANAGEMENT_SERVER_ADDRESS: "0.0.0.0"
  MANAGEMENT_SERVER_PORT: "8081"

  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/airbnb"
  SPRING_DATASOURCE_USERNAME: "airbnb"

  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  RATE_LIMIT_REDIS_HOST: "redis-ratelimit"
  RATE_LIMIT_REDIS_PORT: "6379"

  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"

  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED: "true"
  ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"


  SERVER_SHUTDOWN: "graceful"

  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"