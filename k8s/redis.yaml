apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: airbnb

spec:
  selector:
    app: redis

  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: airbnb

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: redis:8.2.10-alpine

          command: ["redis-server"]

          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"

          ports:
            - containerPort: 6379

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service

metadata:
  name: redis-ratelimit
  namespace: airbnb

spec:
  selector:
    app: redis-ratelimit

  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis-ratelimit
  namespace: airbnb

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: redis-ratelimit

  template:
    metadata:
      labels:
        app: redis-ratelimit

    spec:
      containers:
        - name: redis-ratelimit
          image: redis:8.2.10-alpine

          command: ["redis-server"]

          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "64mb"
            - "--maxmemory-policy"
            - "noeviction"

          ports:
            - containerPort: 6379

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3